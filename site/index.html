<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Front Desk</title>
  <meta name="description" content="Ask a question and get answers sourced from our documentation." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Albert+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 6a2 2 0 0 1 2 2v1.1A9 9 0 0 1 25 18v2H7v-2a9 9 0 0 1 7-8.9V8a2 2 0 0 1 2-2Z' fill='%23A9853C'/%3E%3Crect x='5' y='22' width='22' height='3' rx='1.5' fill='%232E4B42'/%3E%3C/svg%3E" />
  <script>
    // ── Customize your Front Desk here ─────────────────────────────
    window.FRONT_DESK = {
      orgName: "Your Organization",          // shown in the header eyebrow
      tagline: "How can we help?",           // hero heading
      subtitle: "Ask about our documents or the Hubverse directory. Every answer stays tied to a cited source.",
      suggestions: [                          // example questions shown as chips
        "What hubs are available?",
        "Which active hubs are available?",
        "How do I get started with Hubverse?"
      ]
    };
  </script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand">
        <button type="button" class="bell-button" id="bell-button" title="Ring for service" aria-label="Ring the bell and ask a question">
          <svg class="bell" id="bell" viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
            <path d="M16 6a2 2 0 0 1 2 2v1.1A9 9 0 0 1 25 18v2H7v-2a9 9 0 0 1 7-8.9V8a2 2 0 0 1 2-2Z" fill="var(--brass)"/>
            <rect x="5" y="22" width="22" height="3" rx="1.5" fill="var(--spruce)"/>
          </svg>
        </button>
        <span class="wordmark">Front Desk</span>
      </div>
      <span class="eyebrow" id="org-name"></span>
    </div>
    <div class="rule-double"></div>
  </header>

  <main class="desk">
    <section class="hero">
      <h1 id="tagline"></h1>
      <p class="subtitle" id="subtitle"></p>

      <form class="register" id="ask-form">
        <input
          type="text"
          id="question"
          class="register-line"
          placeholder="Type your question…"
          autocomplete="off"
          aria-label="Your question"
        />
        <button type="submit" class="ask-button" id="ask-button">Ask</button>
      </form>

      <div class="source-filter">
        <label for="source-scope">Search in</label>
        <select id="source-scope" aria-label="Choose which sources to search">
          <option value="auto">Auto — all sources</option>
          <option value="codes">Clinical codes workbook</option>
          <option value="website">Hubverse website</option>
          <option value="docs">Hubverse documentation</option>
        </select>
        <span class="ai-note">Search and answers run without a paid API</span>
      </div>

      <div class="chips" id="chips"></div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>

    <section class="ledger" id="ledger" aria-live="polite"></section>
  </main>

  <footer class="colophon">
    <div class="rule-double"></div>
    <p id="footer-note">Answers are drawn from the files in this repository.</p>
    <p class="colophon-meta">
      <span id="index-meta"></span>
    </p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
