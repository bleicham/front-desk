name: Build index & deploy Front Desk

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly refresh (Mondays 06:00 UTC) so websites & external repos stay current

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: minilm-l6-v2-quantized

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Build search index (knowledge folder + external sources)
        run: npm run build
        env:
          REPOS_TOKEN: ${{ secrets.REPOS_TOKEN }}

      - name: Check retrieval accuracy
        run: npm run evaluate

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
