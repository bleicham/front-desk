# Front Desk sources
#
# The structured Hubverse directory is parsed as complete records. Its build
# fails if Hubverse's published total does not match the number of table rows,
# which prevents a partial or changed page from being presented as complete.

structured_sources:
  - type: hubverse-hub-directory
    url: https://hubverse.io/community/hubs.html
    citation: https://hubverse.io/community/hubs.html
    required: true

# These pages are also indexed for ordinary questions about the Hubverse site
# and documentation. The weekly workflow refreshes them automatically.
websites:
  - url: https://hubverse.io/
    title: Hubverse
    crawl: true
    sitemap: true
    maxPages: 60

  - url: https://docs.hubverse.io/en/stable/
    title: Hubverse Documentation
    crawl: true
    sitemap: true
    maxPages: 60

repositories:
  # Add public GitHub repositories here when their documentation should be
  # searchable. Examples:
  # - hubverse-org/hubDocs
  # - repo: your-org/your-handbook
  #   include:
  #     - docs/
  #     - README.md
  #
  # For a private repository, save a fine-grained read-only token as the
  # repository Actions secret REPOS_TOKEN. Never put a token in this file.
